[project]
name = "tslm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cogdb>=4.0.2",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "spacy>=3.8.16",
    "stanza>=1.14.0",
    "torch>=2.4.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.19.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }